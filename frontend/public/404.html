<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AILIMITS</title>
    <!--
      Single Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages
      Redirects deep links (e.g. /founder) back to index.html so the
      React router can handle them, since GitHub Pages serves this 404
      page for any path that isn't a real file.
    -->
    <script type="text/javascript">
      // For a custom apex domain the app is served from the root, so
      // pathSegmentsToKeep is 0. (Use 1 if hosting under /<repo-name>/.)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
